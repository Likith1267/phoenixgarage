<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Service | PHOENIX GARAGE</title><meta name="description" content="Premium automotive parts and services"><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">SERVICE BOOKING</div><h1>BOOK YOUR <span>GARAGE SLOT.</span></h1></section><section class="container"><div class="checkout"><form class="panel" style="padding:25px" id="bookForm"><div class="formGrid"><input required placeholder="Name"><input required placeholder="Phone"><input type="email" required placeholder="Email"><select id="service"><option>Precision Scan</option><option>Periodic Service</option><option>Upgrade Installation</option><option>Premium Detail</option><option>Brake Care</option><option>Electrical Care</option></select><input required placeholder="Vehicle"><input type="date" required></div><textarea placeholder="Notes" style="margin-top:14px"></textarea><button class="btn primary" style="margin-top:14px">CONFIRM REQUEST</button></form><aside class="panel" style="padding:25px"><h3>Booking flow</h3><p class="lead">Demo only. Connect this form to your backend/CRM for real bookings.</p><div class="notice">Workshop availability can be confirmed after submission.</div></aside></div></section></main><script src="../assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let s=new URLSearchParams(location.search).get('service');if(s)service.value=s;bookForm.onsubmit=async e=>{e.preventDefault();try{const inputs=bookForm.querySelectorAll('input,select,textarea');const r=await api('/bookings',{method:'POST',body:JSON.stringify({name:inputs[0].value,phone:inputs[1].value,email:inputs[2].value,service:service.value,vehicle:inputs[4].value,date:inputs[5].value,notes:inputs[6].value})});alert('Booking request #'+r.booking_id+' received.');bookForm.reset()}catch(err){alert(err.message)}}})</script></body></html>
