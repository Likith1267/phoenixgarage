<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | PHOENIX GARAGE</title><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">PRODUCT DETAIL</div><h1 id="pname">PRODUCT.</h1><p class="lead" id="crumb"></p></section><section class="container" style="padding-top:15px"><div class="checkout"><div><div class="panel" style="padding:25px"><div class="productArt" id="part" style="height:440px;font-size:125px"></div><div class="row" style="margin-top:18px"><span class="pill" id="tag"></span><span class="pill" id="brand"></span><span class="pill" id="oem"></span></div></div><div class="panel" style="padding:25px;margin-top:15px"><div class="eyebrow">SPECIFICATIONS</div><h2>Know the part.</h2><div class="grid" style="grid-template-columns:1fr 1fr"><div><small>Category</small><h4 id="specCat"></h4></div><div><small>Vehicle type</small><h4 id="specType"></h4></div><div><small>Availability</small><h4 id="specStock"></h4></div><div><small>Fitment</small><h4 id="specFit"></h4></div><div><small>Part number</small><h4 id="specPart"></h4></div><div><small>Manufacturer</small><h4 id="specMfg"></h4></div></div><div class="line"></div><div class="eyebrow">ABOUT THIS PART</div><p id="description" class="lead"></p><ul id="features" class="featureList"></ul></div></div><aside class="panel summary" style="padding:25px"><div class="eyebrow" id="pcat"></div><h2 id="pn"></h2><p id="fit" class="lead"></p><div class="ratingLine"><span id="rating"></span><span id="reviews"></span><span class="stock" id="availability"></span></div><div><span class="price" id="price"></span><span class="old" id="old"></span><span class="discount" id="discount"></span></div><div class="notice" style="margin-top:18px">✓ Check your exact vehicle before ordering.</div><div class="deliveryBox"><b>Delivery</b><span id="delivery"></span><b>Warranty</b><span id="warranty"></span><b>Returns</b><span id="returns"></span></div><button class="btn primary" id="add" style="width:100%;margin-top:20px">ADD TO BAG</button><button class="btn" id="wish" style="width:100%;margin-top:10px">♡ SAVE TO WISHLIST</button><button class="btn" id="compare" style="width:100%;margin-top:10px">⇄ ADD TO COMPARE</button><a class="btn" href="fitment.html" style="display:block;text-align:center;margin-top:10px">CHECK FITMENT</a></aside></div></section></main><script src="../assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let id=+(new URLSearchParams(location.search).get('id')||1),p=(await loadCatalog()).find(x=>x.id===id)||PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];pname.textContent=p.name;pn.textContent=p.name;pcat.textContent=p.cat;crumb.textContent=`${p.cat} / ${p.brand} / ${p.oem}`;fit.textContent=p.fit;price.textContent=money(p.price);old.textContent=money(p.old);let discount=p.old?Math.round((1-p.price/p.old)*100):0;document.getElementById('discount').textContent=discount?`-${discount}%`:'';document.getElementById('rating').textContent=`★ ${p.rating||'—'}`;document.getElementById('reviews').textContent=`${p.reviews||0} reviews`;document.getElementById('availability').textContent=p.stock>0?(p.stock<=5?`Only ${p.stock} left`:'In stock'):'Out of stock';document.getElementById('delivery').textContent=p.delivery||'—';document.getElementById('warranty').textContent=p.warranty||'—';document.getElementById('returns').textContent=(p.return_days||7)+' days';part.style.backgroundImage=`url('${productImage(p)}')`;part.style.backgroundSize="contain";part.style.backgroundPosition="center";part.style.backgroundRepeat="no-repeat";part.innerHTML=`<small>${p.tag}</small>`;tag.textContent=p.tag;brand.textContent=p.brand;oem.textContent='REF '+p.oem;specCat.textContent=p.cat;specType.textContent=p.type;specStock.textContent=p.stock+' units';specFit.textContent=p.fit;specPart.textContent=p.part_number||p.oem;specMfg.textContent=p.manufacturer_type||'Manufacturer';description.textContent=p.description||'Premium automotive component from the PHOENIX GARAGE catalogue.';features.innerHTML=(p.features||[]).map(x=>`<li>${x}</li>`).join('');add.onclick=()=>addToCart(p.id);function sync(){wish.textContent=getWishlist().includes(p.id)?'♥ SAVED TO WISHLIST':'♡ SAVE TO WISHLIST';compare.textContent=getCompare().includes(p.id)?'✓ IN COMPARE':'⇄ ADD TO COMPARE'}wish.onclick=()=>{toggleWishlist(p.id);sync()};compare.onclick=()=>{toggleCompare(p.id);sync()};sync()})</script></body></html>
