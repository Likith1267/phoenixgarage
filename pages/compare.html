<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare | PHOENIX GARAGE</title><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">PART COMPARISON</div><h1>COMPARE <span>PARTS.</span></h1><p class="lead">Compare up to three parts side by side before you buy.</p></section><section class="container"><div id="compareWrap"></div></section></main><script src="../assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let ids=getCompare(),ps=ids.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);compareWrap.innerHTML=ps.length?`<div style="overflow:auto"><table class="compareTable"><thead><tr><th>Specification</th>${ps.map(p=>`<th>${p.name}<br><span class="pill">${p.brand}</span></th>`).join('')}</tr></thead><tbody>${[['Price',p=>`<span class="priceCell">${money(p.price)}</span>`],['Category',p=>p.cat],['OEM / Part No.',p=>p.oem],['Vehicle type',p=>p.type],['Fitment',p=>p.fit],['Availability',p=>`${p.stock} units`],['Rating',p=>`★ ${p.rating||'—'} (${p.reviews||0})`],['Delivery',p=>p.delivery||'—'],['Warranty',p=>p.warranty||'—'],['Type',p=>p.tag]].map(([k,fn])=>`<tr><th>${k}</th>${ps.map(p=>`<td>${fn(p)}</td>`).join('')}</tr>`).join('')}<tr><th>Action</th>${ps.map(p=>`<td><button class="btn primary" onclick="addToCart(${p.id})">ADD TO BAG</button></td>`).join('')}</tr></tbody></table></div><div class="row" style="margin-top:15px"><button class="btn" onclick="localStorage.setItem('apex_compare','[]');location.reload()">CLEAR COMPARE</button><a class="btn" href="shop.html">ADD MORE PARTS</a></div>`:'<div class="emptyState"><h3>Nothing to compare yet.</h3><p class="lead">Use “Compare” on product cards to build your shortlist.</p><a class="btn primary" href="shop.html">BROWSE PARTS →</a></div>'})</script></body></html>
