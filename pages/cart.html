<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | PHOENIX GARAGE</title><meta name="description" content="Premium automotive parts and services"><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">YOUR BAG</div><h1>READY TO <span>CHECK OUT.</span></h1></section><section class="container"><div class="checkout"><div class="panel" style="padding:24px"><div id="cartPage"></div></div><aside class="panel summary" style="padding:24px"><h3>Order summary</h3><div class="row between"><span>Subtotal</span><b id="sumSubtotal"></b></div><div class="line"></div><div class="row between"><b>Total</b><b id="sumTotal" class="price"></b></div><a href="checkout.html" class="btn primary" style="display:block;text-align:center;margin-top:18px">CHECKOUT →</a></aside></div></section></main><script src="../assets/app.js"></script><script>function renderCartPage(){let c=getCart();cartPage.innerHTML=c.length?c.map(r=>{let p=PRODUCTS.find(x=>x.id===r.id);if(!p)return '';return `<div class="cartItem"><div><b>${p.name}</b><small style="display:block;color:var(--muted)">${p.brand||''} · Qty ${r.qty}</small></div><div><b>${money(p.price*r.qty)}</b> <button class="iconbtn" onclick="removeCart(${p.id})">×</button></div></div>`}).join(''):'<div class="notice warn">Your cart is empty. <a href="shop.html"><b>Browse shop →</b></a></div>';sumSubtotal.textContent=sumTotal.textContent=money(cartTotal())}window.renderCartPage=renderCartPage;document.addEventListener('DOMContentLoaded',renderCartPage)</script></body></html>
