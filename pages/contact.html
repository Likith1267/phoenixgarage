<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | PHOENIX GARAGE</title><meta name="description" content="Premium automotive parts and services"><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">CONTACT</div><h1>TALK TO <span>THE GARAGE.</span></h1></section><section class="container"><div class="checkout"><form class="panel" style="padding:25px" id="contactForm"><div class="formGrid"><input required placeholder="Name"><input type="email" required placeholder="Email"><input required placeholder="Phone"><select id="topic"><option>Product enquiry</option><option>Fitment help</option><option>Service booking</option><option>Order support</option></select></div><textarea required placeholder="How can we help?" style="margin-top:14px"></textarea><button class="btn primary" style="margin-top:14px">SEND MESSAGE</button></form><aside class="panel" style="padding:25px"><h3>Customer support</h3><p class="lead">Replace demo contact information with your actual phone, email, WhatsApp and workshop address before launch.</p></aside></div></section></main><script src="../assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>contactForm.onsubmit=async e=>{e.preventDefault();try{const inputs=contactForm.querySelectorAll('input,select,textarea');await api('/contact',{method:'POST',body:JSON.stringify({name:inputs[0].value,email:inputs[1].value,phone:inputs[2].value,topic:topic.value,message:inputs[4].value})});contactForm.reset();alert('Message sent to Phoenix Garage.')}catch(err){alert(err.message)}})</script></body></html>
