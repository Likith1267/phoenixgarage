<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | PHOENIX GARAGE</title><script>(function(){try{var t=localStorage.getItem("apex_theme");document.documentElement.dataset.theme=(t==="dark"||t==="light"||t==="system")?t:"dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">FULL CATALOGUE</div><h1>SHOP <span>PARTS.</span></h1><p class="lead">Find parts by category, vehicle, brand, OEM number or part number.</p></section><section class="container" style="padding-top:20px"><div class="vehicleSummary"><span>🚗</span><span><b id="vehicleText">No vehicle selected</b><small id="vehicleSub" style="display:block;color:var(--muted)">Use fitment to narrow the catalogue to your vehicle.</small></span><button class="btn" id="toggleFitment" style="margin-left:auto">USE VEHICLE FITMENT</button><a class="btn" href="fitment.html">CHANGE VEHICLE</a></div><div class="searchWrap"><input id="q" autocomplete="off" placeholder="Search part, brand, OEM or part number"><div class="searchSuggestions" id="suggestions"></div></div><div class="catalogCategories" id="catalogCategories"><div class="sectionNote">PARTS CATEGORIES</div><div class="categoryChips" id="categoryChips"></div></div><div class="filters"><select id="cat"><option value="">All categories</option></select><select id="type"><option value="">All vehicles</option><option>Car</option><option>Bike</option></select><select id="brand"><option value="">All brands</option></select><select id="availability"><option value="">All stock</option><option value="in-stock">In stock</option><option value="out-of-stock">Out of stock</option></select><select id="sort"><option value="featured">Featured</option><option value="price-asc">Price low-high</option><option value="price-desc">Price high-low</option><option value="rating">Top rated</option><option value="newest">Newest</option></select></div><div class="row between" style="margin-bottom:18px"><span class="sectionNote" id="count"></span><div class="row"><a class="btn" href="wishlist.html">♡ Wishlist</a><a class="btn" href="compare.html">⇄ Compare</a><button class="btn" id="clear">CLEAR</button></div></div><div class="grid" id="shopGrid"></div></section></main><script src="../assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{let catalog=[];let useFitment=Boolean(localStorage.getItem('apex_vehicle'));const saved=JSON.parse(localStorage.getItem('apex_vehicle')||'null');if(saved)vehicleText.textContent=`${saved.year} ${saved.brand} ${saved.model}${saved.variant?' · '+saved.variant:''}`;if(saved)vehicleSub.textContent='Vehicle fitment is available. Toggle it on to show only compatible parts.';toggleFitment.textContent=useFitment?'FITMENT ON':'USE VEHICLE FITMENT';const categoryChips=document.getElementById('categoryChips');let activeCategoryId=new URLSearchParams(location.search).get('category_id')||'';async function loadCategories(){try{const cs=await api('/catalog/categories');categoryChips.innerHTML=cs.map(c=>`<button class="categoryChip" data-category-id="${c.id}">${c.name}<small>${c.product_count}</small></button>`).join('');categoryChips.querySelectorAll('.categoryChip').forEach(b=>b.onclick=()=>{activeCategoryId=activeCategoryId===b.dataset.categoryId?'':b.dataset.categoryId;categoryChips.querySelectorAll('.categoryChip').forEach(x=>x.classList.toggle('active',x.dataset.categoryId===activeCategoryId));cat.value='';draw()})}catch(e){categoryChips.innerHTML=''}};function fillSelects(base){cat.innerHTML='<option value="">All categories</option>';brand.innerHTML='<option value="">All brands</option>';[...new Set(base.map(p=>p.cat||p.category))].sort().forEach(x=>cat.add(new Option(x,x)));[...new Set(base.map(p=>p.brand))].sort().forEach(x=>brand.add(new Option(x,x)))}let drawTimer;async function draw(){const v=useFitment&&saved?saved:null;const params={q:q.value.trim(),category:cat.value,category_id:activeCategoryId,type:type.value,brand:brand.value,availability:availability.value,sort:sort.value};if(v)params.vehicle_id=v.id;catalog=await loadCatalog(params);count.textContent=`${catalog.length} part${catalog.length===1?'':'s'} found${v?' for your vehicle':''}`;shopGrid.innerHTML=catalog.map(productCard).join('')||'<div class="emptyState" style="grid-column:1/-1"><h3>No parts found</h3><p class="lead">Try another keyword, clear a filter, or choose a different vehicle.</p></div>'}await loadCategories();if(activeCategoryId){const activeChip=categoryChips.querySelector(`[data-category-id="${activeCategoryId}"]`);if(activeChip)activeChip.classList.add('active');}try{const fresh=await loadCatalog({category_id:activeCategoryId});if(fresh.length){catalog=fresh;fillSelects(catalog)}}catch(e){}if(!catalog.length){catalog=PRODUCTS.slice();fillSelects(catalog)}q.oninput=async()=>{clearTimeout(drawTimer);const term=q.value.trim();if(term.length<2){suggestions.classList.remove('open');return}try{const rs=await api('/search/suggestions?q='+encodeURIComponent(term));suggestions.innerHTML=rs.map(r=>`<a href="product.html?id=${r.id}" class="searchResult"><span><b>${r.name}</b><small>${r.brand} · ${r.category} · ${r.part_number}</small></span><strong>View</strong></a>`).join('')||'<div class="searchResult"><span><b>No matching parts</b><small>Try an OEM number, brand or part name.</small></span></div>';suggestions.classList.add('open')}catch(e){suggestions.classList.remove('open')}drawTimer=setTimeout(draw,120)};[cat,type,brand,availability,sort].forEach(el=>el.onchange=draw);clear.onclick=()=>{q.value='';cat.value='';type.value='';brand.value='';availability.value='';sort.value='featured';activeCategoryId='';categoryChips.querySelectorAll('.categoryChip').forEach(x=>x.classList.remove('active'));suggestions.classList.remove('open');draw()};toggleFitment.onclick=()=>{if(!saved){location.href='fitment.html';return}useFitment=!useFitment;toggleFitment.textContent=useFitment?'FITMENT ON':'FITMENT OFF';draw()};document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))suggestions.classList.remove('open')});draw()})</script></body></html>
