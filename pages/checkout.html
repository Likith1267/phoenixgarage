<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | PHOENIX GARAGE</title><meta name="description" content="Premium automotive parts and services"><script>(function(){try{var t=localStorage.getItem("apex_theme");if(t==="dark"||t==="light"||t==="system")document.documentElement.dataset.theme=t;else document.documentElement.dataset.theme="dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/styles.css"></head><body><main><section class="pagehero container"><div class="eyebrow">SECURE CHECKOUT</div><h1>COMPLETE <span>YOUR ORDER.</span></h1></section><section class="container"><div class="checkout"><form class="panel" style="padding:24px" id="checkoutForm"><h3>Contact & shipping</h3><div class="formGrid"><input required placeholder="Full name"><input required placeholder="Phone"><input type="email" required placeholder="Email"><input required placeholder="PIN code"><input required placeholder="City"><input required placeholder="State"></div><textarea required placeholder="Full address" style="margin-top:14px"></textarea><h3>Payment</h3><div class="notice warn">Phase 2 demo checkout: order is stored securely in the local database. No real payment data is collected.</div><p id="checkoutMsg" class="lead"></p><button class="btn primary" style="width:100%;margin-top:14px">PLACE DEMO ORDER</button></form><aside class="panel summary" style="padding:24px"><h3>Your order</h3><div id="orderLines"></div><div class="line"></div><div class="row between"><b>Total</b><b class="price" id="orderTotal"></b></div></aside></div></section></main><script src="../assets/app.js"></script><script>function renderCheckout(){let c=getCart();orderLines.innerHTML=c.map(r=>{let p=PRODUCTS.find(x=>x.id===r.id);return p?`<div class="row between" style="margin:12px 0"><span>${p.name} × ${r.qty}</span><b>${money(p.price*r.qty)}</b></div>`:''}).join('')||'<p class="lead">Cart is empty.</p>';orderTotal.textContent=money(cartTotal())}window.renderCheckout=renderCheckout;document.addEventListener('DOMContentLoaded',()=>{renderCheckout();checkoutForm.onsubmit=async e=>{e.preventDefault();if(!getCart().length)return alert('Cart is empty.');if(!localStorage.getItem('apex_token')){checkoutMsg.textContent='Please sign in before placing an order.';return setTimeout(()=>location.href='account.html',800)}const inputs=checkoutForm.querySelectorAll('input,textarea');const [name,phone,email,pin,city,state]=[...inputs].slice(0,6).map(x=>x.value);const address=inputs[6]?.value||'';checkoutMsg.textContent='Placing order…';try{const d=await api('/orders',{method:'POST',body:JSON.stringify({items:getCart(),shipping:{full_name:name,phone,address,city,state,pincode:pin,email}})});localStorage.setItem('apex_cart','[]');localStorage.setItem('apex_last_order',d.order_id);location.href='success.html?order='+d.order_id}catch(err){checkoutMsg.textContent=err.message}}})</script></body></html>
